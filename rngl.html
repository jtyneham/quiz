<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Random Letter Generator</title>

  <style>
    :root {
      --page-bg: #eeeeee;
      --card-bg: #ffffff;
      --card-text: #000000;
      --text: #333333;
      --accent: #2c6dc4;
      --accent-hover: #245da8;
      --generating: #999999;

      --ticker-bg: #202127;
      --ticker-text: #ffffff;
      --ticker-separator: #8c9199;
      --ticker-border: #2d3035;

      --topbar-height: 4.25rem;
      --ticker-height: 16rem;

      --page-inline: clamp(1rem, 4vw, 2rem);
      --page-block: clamp(0.5rem, 1.5dvh, 1rem);

      --card-size: min(68vw, 20rem, 38dvh);
      --button-height: 4.5rem;

      --font-ui: clamp(1rem, 2.8vw, 1.25rem);
      --font-button: clamp(1.15rem, 3vw, 1.35rem);
      --font-ticker: calc(var(--font-button) * 1.35);
      --font-letter: clamp(8rem, 32vw, 13rem);

      --radius-card: 0.95rem;
      --radius-button: 0.7rem;
      --radius-pill: 999rem;

      --gap-small: 0.65rem;
      --gap-medium: 1.1rem;
      --gap-large: 1.5rem;

      --shadow-card:
        0 0.7rem 1.8rem rgba(0, 0, 0, 0.12),
        0 0.15rem 0.5rem rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      background: var(--page-bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 1rem;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows:
        calc(var(--topbar-height) + env(safe-area-inset-top))
        minmax(0, 1fr)
        calc(var(--ticker-height) + env(safe-area-inset-bottom));
      overflow: hidden;
      background: var(--page-bg);
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: var(--gap-medium);
      padding:
        env(safe-area-inset-top)
        max(var(--page-inline), env(safe-area-inset-right))
        var(--page-block)
        max(var(--page-inline), env(safe-area-inset-left));
    }

    .fullscreen-button,
    .ideas-control {
      color: #3d3d3d;
      font-size: var(--font-ui);
      -webkit-tap-highlight-color: transparent;
    }

    .fullscreen-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45em;
      min-height: 2.4em;
      padding: 0.25em 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .fullscreen-button svg {
      width: 1.35em;
      height: 1.35em;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fullscreen-button:focus-visible,
    .ideas-control input:focus-visible + .switch {
      outline: 0.14rem solid var(--accent);
      outline-offset: 0.2rem;
    }

    .fullscreen-button:focus-visible {
      border-radius: 0.35em;
    }

    .ideas-control {
      display: inline-flex;
      align-items: center;
      gap: 0.65em;
      user-select: none;
      cursor: pointer;
    }

    .ideas-control input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .switch {
      position: relative;
      width: 3em;
      height: 1.7em;
      flex: 0 0 auto;
      border: 0.07em solid #b8b8b8;
      border-radius: var(--radius-pill);
      background: #d4d4d4;
      transition:
        background-color 180ms ease,
        border-color 180ms ease;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 0.19em;
      left: 0.19em;
      width: 1.18em;
      height: 1.18em;
      border-radius: 50%;
      background: #777777;
      transition:
        transform 180ms ease,
        background-color 180ms ease;
    }

    .ideas-control input:checked + .switch {
      background: var(--accent);
      border-color: var(--accent);
    }

    .ideas-control input:checked + .switch::after {
      transform: translateX(1.25em);
      background: #ffffff;
    }

    .main {
      min-height: 0;
      display: grid;
      place-items: center;
      padding:
        clamp(0.5rem, 1.5dvh, 1rem)
        var(--page-inline)
        clamp(1rem, 3dvh, 2rem);
      overflow: hidden;
    }

    .generator {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--gap-large);
      align-self: center;
    }

    .letter-card {
      width: var(--card-size);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: var(--radius-card);
      background: var(--card-bg);
      color: var(--card-text);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: var(--shadow-card);
      transition:
        background-color 160ms ease,
        box-shadow 160ms ease,
        transform 160ms ease;
    }

    .letter-card:hover {
      background: #fafafa;
      box-shadow:
        0 0.85rem 2rem rgba(0, 0, 0, 0.14),
        0 0.2rem 0.6rem rgba(0, 0, 0, 0.09);
    }

    .letter-card:active {
      transform: scale(0.985);
    }

    .letter-card:focus-visible {
      outline: 0.18rem solid rgba(44, 109, 196, 0.65);
      outline-offset: 0.3rem;
    }

    .letter {
      font-size: var(--font-letter);
      line-height: 0.9;
      font-weight: 700;
      letter-spacing: -0.05em;
      transform-origin: center;
    }

    .letter.pop {
      animation: pop 360ms cubic-bezier(0.2, 0.9, 0.25, 1.25);
    }

    @keyframes pop {
      0% {
        transform: scale(0.72);
        opacity: 0.3;
      }

      62% {
        transform: scale(1.13);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .generate-button {
      width: var(--card-size);
      min-height: var(--button-height);
      padding: 0.75em 1.4em;
      border: 0;
      border-radius: var(--radius-button);
      background: var(--accent);
      color: #ffffff;
      font-size: var(--font-button);
      font-weight: 650;
      cursor: pointer;
      transition:
        background-color 160ms ease,
        transform 160ms ease;
    }

    .generate-button:hover {
      background: var(--accent-hover);
    }

    .generate-button:active {
      transform: scale(0.985);
    }

    .generate-button:focus-visible {
      outline: 0.18rem solid rgba(44, 109, 196, 0.45);
      outline-offset: 0.25rem;
    }

    .generate-button.generating,
    .generate-button.generating:hover {
      background: var(--generating);
    }

    .generate-button:disabled,
    .letter-card:disabled {
      cursor: default;
    }

    .letter-card:disabled {
      opacity: 0.82;
    }

    .ticker-shell {
      position: relative;
      min-width: 0;
      height: calc(var(--ticker-height) + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      overflow: hidden;
      border-top: 0.06rem solid transparent;
      background: transparent;
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 180ms ease,
        visibility 180ms step-end,
        background-color 180ms ease,
        border-color 180ms ease;
    }

    .ticker-shell.visible {
      opacity: 1;
      visibility: visible;
      border-top-color: var(--ticker-border);
      background: var(--ticker-bg);
      transition:
        opacity 180ms ease,
        visibility 0ms step-start,
        background-color 180ms ease,
        border-color 180ms ease;
    }

    .ticker-shell::before,
    .ticker-shell::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: env(safe-area-inset-bottom);
      z-index: 3;
      width: min(7vw, 3.25rem);
      pointer-events: none;
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .ticker-shell.visible::before,
    .ticker-shell.visible::after {
      opacity: 1;
    }

    .ticker-shell::before {
      left: 0;
      background: linear-gradient(
        to right,
        var(--ticker-bg) 0%,
        rgba(32, 33, 39, 0.94) 34%,
        rgba(32, 33, 36, 0) 100%
      );
    }

    .ticker-shell::after {
      right: 0;
      background: linear-gradient(
        to left,
        var(--ticker-bg) 0%,
        rgba(32, 33, 39, 0.94) 34%,
        rgba(32, 33, 36, 0) 100%
      );
    }

    .ticker-stack {
      width: 100%;
      height: var(--ticker-height);
      display: grid;
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 0.5rem;
      overflow: hidden;
      padding-block: 1rem;
    }

    .ticker-viewport {
      width: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .ticker-track {
      display: flex;
      width: max-content;
      align-items: center;
      will-change: transform;
    }

    .ticker-group {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .topic {
      color: var(--ticker-text);
      font-size: var(--font-ticker);
      font-weight: 100;
      line-height: 1;
      letter-spacing: 0.01em;
    }

    .separator {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 0.62em;
      min-width: 0.62em;
      margin-inline: 0.4em;
      padding: 0;
      color: rgba(255, 255, 255, 0.55);
      font-size: 1.4em;
      font-weight: 400;
      line-height: 1;
      transform: translateY(-0.02em);
    }

    @media (max-height: 42rem) {
      :root {
        --topbar-height: 3.5rem;
        --ticker-height: 13rem;
        --card-size: min(54vw, 15rem, 35dvh);
        --button-height: 3.6rem;
        --font-letter: clamp(6.5rem, 27vw, 10rem);
        --font-ticker: calc(var(--font-button) * 1.25);
      }

      .generator {
        gap: var(--gap-medium);
      }

      .ticker-stack {
        padding-block: 0.8rem;
      }
    }

    @media (max-width: 34rem) {
      :root {
        --page-inline: 1rem;
        --card-size: min(68vw, 18rem, 36dvh);
        --font-ui: 1rem;
        --font-button: 1.2rem;
        --font-ticker: 1.75rem;
        --font-letter: clamp(9.5rem, 38vw, 15rem);
      }

    }


    /* Additional reveal animation layers */
    .letter-card {
      position: relative;
      overflow: hidden;
      perspective: 900px;
    }

    .letter[hidden] {
      display: none;
    }

    .letter.flip-step {
      animation: flipStep 230ms ease-in-out;
    }

    @keyframes flipStep {
      0% {
        transform: rotateX(0deg);
        opacity: 1;
      }

      48% {
        transform: rotateX(90deg);
        opacity: 0.28;
      }

      52% {
        transform: rotateX(-90deg);
        opacity: 0.28;
      }

      100% {
        transform: rotateX(0deg);
        opacity: 1;
      }
    }

    .tunnel-layer {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--card-text);
      font-size: var(--font-letter);
      line-height: 0.9;
      font-weight: 700;
      letter-spacing: -0.05em;
      opacity: 0;
      pointer-events: none;
    }

    .tunnel-layer.tunnel-run {
      animation: tunnelRush 230ms cubic-bezier(0.12, 0.72, 0.18, 1);
    }

    @keyframes tunnelRush {
      0% {
        transform: scale(2.2);
        opacity: 0;
        filter: blur(0.45rem);
      }

      35% {
        opacity: 0.82;
      }

      100% {
        transform: scale(0.12);
        opacity: 0;
        filter: blur(0.08rem);
      }
    }

    .wheel-scene {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: none;
      place-items: center;
      background: var(--card-bg);
      pointer-events: none;
    }

    .wheel-scene.visible {
      display: grid;
    }

    .wheel-layout {
      position: relative;
      width: 92%;
      aspect-ratio: 1;
    }

    .wheel-visual {
      position: absolute;
      inset: 0;
      transition:
        opacity 180ms ease,
        filter 180ms ease;
    }

    .wheel-visual.greyed {
      opacity: 0.24;
      filter: grayscale(1);
    }

    .wheel-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .wheel-spinner {
      transform-origin: 150px 150px;
      will-change: transform;
    }

    .wheel-pointer {
      position: absolute;
      top: -0.5%;
      left: 50%;
      z-index: 4;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 0.85rem solid transparent;
      border-right: 0.85rem solid transparent;
      border-top: 1.65rem solid var(--accent);
      filter: drop-shadow(0 0.12rem 0.1rem rgba(0, 0, 0, 0.2));
    }

    .wheel-winner {
      position: absolute;
      left: 50%;
      top: 8.7%;
      z-index: 8;
      display: none;
      width: 1em;
      height: 1em;
      place-items: center;
      color: var(--card-text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.05em;
      transform: translate(-50%, -50%);
      transform-origin: center;
      pointer-events: none;
      will-change: transform, opacity;
    }

    @media (prefers-reduced-motion: reduce) {
      .letter.pop {
        animation: none;
      }
    }
  
    @keyframes buttonPress {
      0% { transform: scale(1); }
      45% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    .generate-button.press {
      animation: buttonPress 180ms ease-out;
    }

</style>
</head>

    <main class="main">
      <section class="generator" aria-label="Random letter generator">
        <button
          id="letterCard"

          <span

            class="tunnel-layer"
            aria-hidden="true"
          ></span>

          <span
            id="wheelScene"
            class="wheel-scene"
            aria-hidden="true"
          >
            <span id="wheelLayout" class="wheel-layout">
              <span id="wheelVisual" class="wheel-visual">
                <svg
                  class="wheel-svg"
                  viewBox="0 0 300 300"
                  aria-hidden="true"
                >
                  <g id="wheelSpinner" class="wheel-spinner"></g>
                  <circle
                    cx="150"
                    cy="150"
                    r="29"
                    fill="#ffffff"
                    stroke="#d4dbe4"
                    stroke-width="3"
                  ></circle>
                </svg>
                <span class="wheel-pointer"></span>
              </span>

              <span id="wheelWinner" class="wheel-winner"></span>
            </span>
          </span>
        </button>

        <button id="generateButton" class="generate-button" type="button">
          Generate
        </button>
      </section>
    </main>

            <div id="tickerGroup4B" class="ticker-group" aria-hidden="true"></div>

        </div>
      </div>

  </div>

    // Slightly faster than the earlier version.
    function tickerSpeed() {
      return Math.max(window.innerWidth / 13.33, 130);
    }

    function shuffle(items) {
      const result = [...items];

      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    function randomWeightedLetter() {
      return weightedLetters[
        Math.floor(Math.random() * weightedLetters.length)
      ];
    }

    function randomDisplayLetter() {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      return alphabet[Math.floor(Math.random() * alphabet.length)];
    }

    function wait(milliseconds) {
      return new Promise((resolve) => setTimeout(resolve, milliseconds));
    }

    function randomRevealAnimation() {
      return REVEAL_ANIMATIONS[
        Math.floor(Math.random() * REVEAL_ANIMATIONS.length)
      ];
    }

    function polar(cx, cy, radius, angleDegrees) {
      const angle = (angleDegrees - 90) * Math.PI / 180;

      return {
        x: cx + radius * Math.cos(angle),
        y: cy + radius * Math.sin(angle)
      };
    }

    function wedgePath(cx, cy, radius, startDegrees, endDegrees) {
      const start = polar(cx, cy, radius, endDegrees);
      const end = polar(cx, cy, radius, startDegrees);
      const largeArc = endDegrees - startDegrees <= 180 ? 0 : 1;

      return [
        `M ${cx} ${cy}`,
        `L ${start.x} ${start.y}`,
        `A ${radius} ${radius} 0 ${largeArc} 0 ${end.x} ${end.y}`,
        "Z"
      ].join(" ");
    }

    function buildLetterWheel() {
      const namespace = "http://www.w3.org/2000/svg";
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const segment = 360 / alphabet.length;

      wheelSpinner.replaceChildren();

      alphabet.split("").forEach((character, index) => {
        const start = index * segment - segment / 2;
        const end = start + segment;

        const wedge = document.createElementNS(namespace, "path");
        wedge.setAttribute(
          "d",
          wedgePath(150, 150, 138, start, end)
        );
        wedge.setAttribute(
          "fill",
          index % 2 === 0 ? "#edf1f5" : "#dfe5ec"
        );
        wedge.setAttribute("stroke", "#ffffff");
        wedge.setAttribute("stroke-width", "1.4");
        wheelSpinner.appendChild(wedge);

        const angle = index * segment;
        const point = polar(150, 150, 108, angle);

        const text = document.createElementNS(namespace, "text");
        text.setAttribute("x", point.x);
        text.setAttribute("y", point.y);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("dominant-baseline", "middle");
        text.setAttribute("fill", "#26303d");
        text.setAttribute("font-size", "14");
        text.setAttribute("font-weight", "800");
        text.setAttribute(
          "font-family",
          "Inter, system-ui, sans-serif"
        );
        text.setAttribute(
          "transform",
          `rotate(${angle} ${point.x} ${point.y})`
        );
        text.textContent = character;
        wheelSpinner.appendChild(text);
      });

      const rim = document.createElementNS(namespace, "circle");
      rim.setAttribute("cx", "150");
      rim.setAttribute("cy", "150");
      rim.setAttribute("r", "138");
      rim.setAttribute("fill", "none");
      rim.setAttribute("stroke", "#cfd7e1");
      rim.setAttribute("stroke-width", "3");
      wheelSpinner.appendChild(rim);
    }

    function resetRevealVisuals() {
      letterElement.hidden = false;
      letterElement.className = "letter";
      letterElement.style.transform = "";
      letterElement.style.opacity = "";

      tunnelLayer.className = "tunnel-layer";
      tunnelLayer.textContent = "";

      wheelScene.classList.remove("visible");
      wheelScene.setAttribute("aria-hidden", "true");
      wheelVisual.classList.remove("greyed");

      wheelWinner.style.display = "none";
      wheelWinner.textContent = "";
      wheelWinner.getAnimations().forEach((animation) => {
        animation.cancel();
      });

      wheelSpinner.getAnimations().forEach((animation) => {
        animation.cancel();
      });
      wheelSpinner.style.transform = `rotate(${wheelRotation}deg)`;
    }

    async function playFinalPop(finalLetter) {
      letterElement.hidden = false;
      letterElement.textContent = finalLetter;
      letterElement.classList.remove("pop");
      void letterElement.offsetWidth;
      letterElement.classList.add("pop");
      await wait(ANIMATION.pop);
      letterElement.classList.remove("pop");
    }

    async function playSlotMachine(finalLetter) {
      const delays = [
        45, 45, 50, 55, 60, 70, 80, 95, 115, 140, 175, 220
      ];

      for (const delay of delays) {
        letterElement.textContent = randomDisplayLetter();
        await wait(delay);
      }

      await playFinalPop(finalLetter);
    }

    async function playMultiFlip(finalLetter) {
      const stepTime = ANIMATION.reveal / ANIMATION.flipCount;

      for (let index = 0; index < ANIMATION.flipCount; index += 1) {
        letterElement.className = "letter";
        void letterElement.offsetWidth;
        letterElement.classList.add("flip-step");

        await wait(stepTime * 0.5);

        letterElement.textContent =
          index === ANIMATION.flipCount - 1
            ? randomDisplayLetter()
            : randomDisplayLetter();

        await wait(stepTime * 0.5);
      }

      letterElement.classList.remove("flip-step");
      await playFinalPop(finalLetter);
    }

    async function playZoomTunnel(finalLetter) {
      const passTime =
        ANIMATION.reveal / ANIMATION.tunnelPasses;

      letterElement.hidden = true;

      for (
        let index = 0;
        index < ANIMATION.tunnelPasses;
        index += 1
      ) {
        tunnelLayer.textContent = randomDisplayLetter();
        tunnelLayer.className = "tunnel-layer";
        void tunnelLayer.offsetWidth;
        tunnelLayer.classList.add("tunnel-run");
        await wait(passTime);
      }

      tunnelLayer.className = "tunnel-layer";
      await playFinalPop(finalLetter);
    }

    async function playLetterWheel(finalLetter) {
      letterElement.hidden = true;
      wheelScene.classList.add("visible");
      wheelScene.setAttribute("aria-hidden", "false");
      wheelVisual.classList.remove("greyed");

      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const spinTime =
        ANIMATION.reveal -
        ANIMATION.wheelHold -
        ANIMATION.wheelTravel;

      const segment = 360 / alphabet.length;
      const selectedIndex = alphabet.indexOf(finalLetter);
      const selectedAngle = selectedIndex * segment;
      const normalized =
        ((wheelRotation % 360) + 360) % 360;

      let delta =
        ANIMATION.wheelTurns * 360 -
        selectedAngle -
        normalized;

      while (delta < ANIMATION.wheelTurns * 360) {
        delta += 360;
      }

      const targetRotation = wheelRotation + delta;

      const spin = wheelSpinner.animate(
        [
          { transform: `rotate(${wheelRotation}deg)` },
          { transform: `rotate(${targetRotation}deg)` }
        ],
        {
          duration: spinTime,
          easing: "cubic-bezier(0.10, 0.66, 0.08, 1)",
          fill: "forwards"
        }
      );

      await spin.finished;

      wheelRotation = targetRotation;
      wheelSpinner.style.transform =
        `rotate(${wheelRotation}deg)`;
      spin.cancel();

      await wait(ANIMATION.wheelHold);

      const layoutRect = wheelLayout.getBoundingClientRect();
      const startY = layoutRect.height * 0.087;
      const centerY = layoutRect.height / 2;
      const travelY = centerY - startY;

      const finalFontSize = parseFloat(
        getComputedStyle(letterElement).fontSize
      );
      const startFontSize = Math.max(
        12,
        layoutRect.width * 0.046
      );
      const scaleToFinal = finalFontSize / startFontSize;

      wheelWinner.textContent = finalLetter;
      wheelWinner.style.display = "grid";
      wheelWinner.style.fontSize = `${startFontSize}px`;
      wheelWinner.style.opacity = "1";
      wheelWinner.style.transform =
        "translate(-50%, -50%) scale(1)";

      wheelVisual.classList.add("greyed");

      const reveal = wheelWinner.animate(
        [
          {
            transform: "translate(-50%, -50%) scale(1)",
            opacity: 1,
            offset: 0
          },
          {
            transform:
              `translate(-50%, calc(-50% + ${travelY}px)) ` +
              `scale(${scaleToFinal})`,
            opacity: 1,
            offset: 0.455
          },
          {
            transform:
              `translate(-50%, calc(-50% + ${travelY}px)) ` +
              `scale(${scaleToFinal * 1.13})`,
            opacity: 1,
            offset: 0.735
          },
          {
            transform:
              `translate(-50%, calc(-50% + ${travelY}px)) ` +
              `scale(${scaleToFinal})`,
            opacity: 1,
            offset: 1
          }
        ],
        {
          duration: ANIMATION.wheelTravel + ANIMATION.pop,
          easing: "linear",
          fill: "forwards"
        }
      );

      await reveal.finished;

      wheelScene.classList.remove("visible");
      wheelScene.setAttribute("aria-hidden", "true");
      wheelWinner.style.display = "none";
      reveal.cancel();

      letterElement.hidden = false;
      letterElement.textContent = finalLetter;
    }

    async function generateLetter() {
      if (isGenerating) {
        return;
      }

      isGenerating = true;
      generateButton.disabled = true;
      generateButton.classList.remove("press");
      void generateButton.offsetWidth;
      generateButton.classList.add("press");
      generateButton.classList.add("generating");
      letterCard.disabled = true;

      resetRevealVisuals();

      const finalLetter = randomWeightedLetter();

      if (prefersReducedMotion) {
        letterElement.textContent = finalLetter;
      } else {
        const selectedAnimation = randomRevealAnimation();

        if (selectedAnimation === "slot") {
          await playSlotMachine(finalLetter);
        } else if (selectedAnimation === "multiFlip") {
          await playMultiFlip(finalLetter);
        } else if (selectedAnimation === "zoomTunnel") {
          await playZoomTunnel(finalLetter);
        } else {
          await playLetterWheel(finalLetter);
        }
      }

      generateButton.disabled = false;
      generateButton.classList.remove("generating");
      generateButton.classList.remove("press");
      letterCard.disabled = false;
      isGenerating = false;
    }

    function fillTopicGroup(group, topicList) {
      group.replaceChildren();

      topicList.forEach((topic) => {
        const topicElement = document.createElement("span");
        topicElement.className = "topic";
        topicElement.textContent = topic;
        group.appendChild(topicElement);

        const separator = document.createElement("span");
        separator.className = "separator";
        separator.textContent = "•";
        separator.setAttribute("aria-hidden", "true");
        group.appendChild(separator);
      });
    }

    function buildTicker() {
      tickerRows.forEach((row) => {
        fillTopicGroup(row.groupA, shuffle(topics));
        fillTopicGroup(row.groupB, shuffle(topics));
      });

      requestAnimationFrame(() => {
        tickerRows.forEach((row) => {
          row.width = row.groupA.getBoundingClientRect().width;
        });
      });
    }

    function animateTicker(timestamp) {
      const elapsedSeconds = Math.min(
        (timestamp - previousTimestamp) / 1000,
        0.1
      );

      previousTimestamp = timestamp;
      const baseSpeed = tickerSpeed();

      tickerRows.forEach((row) => {
        row.offset -= baseSpeed * row.speedFactor * elapsedSeconds;

        if (row.width > 0 && Math.abs(row.offset) >= row.width) {
          row.offset += row.width;

          fillTopicGroup(row.groupA, shuffle(topics));
          fillTopicGroup(row.groupB, shuffle(topics));

          requestAnimationFrame(() => {
            row.width = row.groupA.getBoundingClientRect().width;
          });
        }

        row.track.style.transform =
          `translate3d(${row.offset}px, 0, 0)`;
      });

      requestAnimationFrame(animateTicker);
    }

    function fullscreenElement() {
      return (
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        null
      );
    }

    async function enterFullscreen() {
      const root = document.documentElement;

      if (root.requestFullscreen) {
        await root.requestFullscreen({ navigationUI: "hide" });
      } else if (root.webkitRequestFullscreen) {
        root.webkitRequestFullscreen();
      } else {
        throw new Error("Fullscreen is not supported by this browser.");
      }

      if (screen.orientation?.lock) {
        screen.orientation.lock("portrait").catch(() => {});
      }
    }

    async function exitFullscreen() {
      if (document.exitFullscreen) {
        await document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }

    function updateFullscreenButton() {
      const active = Boolean(fullscreenElement());

      fullscreenButton.setAttribute(
        "aria-label",
        active ? "Exit fullscreen" : "Enter fullscreen"
      );

      fullscreenButton.title = active
        ? "Exit fullscreen"
        : "Fullscreen";

      fullscreenLabel.textContent = active
        ? "Exit"
        : "Fullscreen";

      fullscreenIcon.innerHTML = active
        ? `
          <path d="M3 8h5V3"></path>
          <path d="M21 8h-5V3"></path>
          <path d="M21 16h-5v5"></path>
          <path d="M3 16h5v5"></path>
        `
        : `
          <path d="M8 3H3v5"></path>
          <path d="M16 3h5v5"></path>
          <path d="M21 16v5h-5"></path>
          <path d="M3 16v5h5"></path>
        `;
    }

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (fullscreenElement()) {
          await exitFullscreen();
        } else {
          await enterFullscreen();
        }
      } catch (error) {
        console.warn(error.message);
        fullscreenLabel.textContent = "Unavailable";

        window.setTimeout(() => {
          updateFullscreenButton();
        }, 1600);
      }
    });

    document.addEventListener(
      "fullscreenchange",
      updateFullscreenButton
    );

    document.addEventListener(
      "webkitfullscreenchange",

    });

    window.addEventListener("resize", () => {
      tickerRows.forEach((row) => {
        row.width = row.groupA.getBoundingClientRect().width;
      });
    });

    updateFullscreenButton();
    buildLetterWheel();
    wheelSpinner.style.transform = "rotate(0deg)";
    buildTicker();
    requestAnimationFrame(animateTicker);
  </script>
</body>
</html>
