  "Linguistics","Writing and Scripts","Literary Study","Film Craft","Animation Craft","Music Theory and Craft",
  "Game Development and Culture","Chess and Strategy","Combat Sport Knowledge","Car Technology","Programming",
  "Internet and Networks","Cybersecurity","Engineering Fields","Machines and Mechanisms","Military Organization",
  "Strategy and Tactics","Law","Economics","Finance","Markets and Trade"
]);

function estimateSpecificity(node,parentName=""){
  const name=node.name;
  let score=node.weight>=3?1:node.weight===2?2.15:3;
  const words=name.match(/[A-Za-z0-9]+/g)||[];

  // Longer/context-qualified leaf topics are usually narrower than short standalone subjects.
  if(node.weight===1){
    if(words.length>=5)score+=.55;
    else if(words.length===4)score+=.35;
    else if(words.length===3)score+=.12;
    if(/\b(in|of|by|through|during|under)\b/i.test(name))score+=.25;
  }

  if(SPECIFICITY_SPECIALIST_PARENTS.has(parentName))score+=.5;
  if(SPECIFICITY_NICHE.test(name))score+=.7;
  if(SPECIFICITY_VERY_NICHE.test(name))score+=1.3;
  if(/\bscientific\b.*\bnames?\b/i.test(name))score+=1.15;
  else if(/\bscientific\b/i.test(name))score+=.5;
  if(node.weight===2&&SPECIFICITY_SPECIAL_BRANCH.test(name))score+=.65;
  if(/\b(theory|techniques?|methods?|instruments?|measurement)\b/i.test(name))score+=.3;

  return Math.min(5,Math.max(1,score));
}

function specificityTierForScore(score){
  if(score<1.6)return 1;
  if(score<2.7)return 2;
  if(score<3.35)return 3;
  if(score<3.75)return 4;
  return 5;
}

function flattenTopics(nodes,output=[],parents=[]){
  nodes.forEach(node=>{
    const parentName=parents.length?parents[parents.length-1]:"";
    const specificity=estimateSpecificity(node,parentName);
    output.push({name:node.name,weight:node.weight,id:node.id,specificity,specificityTier:specificityTierForScore(specificity)});
    if(Array.isArray(node.children))flattenTopics(node.children,output,[...parents,node.name]);
  });
  return output;
}
const topics=flattenTopics(topicFamilies);
const topicsBySpecificity=[null,[],[],[],[],[]];
topics.forEach(topic=>topicsBySpecificity[topic.specificityTier].push(topic));

function tickerSpeed(){return Math.max(window.innerWidth/13.33,130)}

function rowHeight(){
  const probe=document.createElement("span");
  probe.className="topic";probe.textContent="Measure";
  probe.style.cssText="position:absolute;visibility:hidden;pointer-events:none";
  tickerStack.appendChild(probe);
  const size=parseFloat(getComputedStyle(probe).fontSize);
  probe.remove();
  const root=parseFloat(getComputedStyle(document.documentElement).fontSize);
  return Math.max(size*1.45,root*2.4);
}

function calculateRowCount(){
  const styles=getComputedStyle(tickerStack);
  const padding=parseFloat(styles.paddingTop)+parseFloat(styles.paddingBottom);
  const gap=parseFloat(styles.rowGap)||0;
  const available=Math.max(tickerStack.clientHeight-padding,0);
  const minimum=rowHeight();
  return Math.max(1,Math.floor((available+gap)/(minimum+gap)));
}

function tierAffinity(tier,targetSpecificity){
  // Choose the specificity tier first so a huge middle-tier pool cannot overwhelm
  // the broad top or niche bottom simply by containing more topics.
  const normalized=(tier-targetSpecificity)/.8;
  return .01+Math.exp(-.5*normalized*normalized);
}

function chooseSpecificityTier(targetSpecificity){
  const tiers=[1,2,3,4,5];
  let roll=Math.random()*tiers.reduce((sum,tier)=>sum+tierAffinity(tier,targetSpecificity),0);
  for(const tier of tiers){roll-=tierAffinity(tier,targetSpecificity);if(roll<=0)return tier}
  return 5;
}

function weightedChoice(items,blocked){
  const available=items.filter(item=>!blocked.has(item.id));
  const candidates=available.length?available:items;
  let roll=Math.random()*candidates.reduce((sum,item)=>sum+item.weight,0);
  for(const item of candidates){roll-=item.weight;if(roll<=0)return item}
  return candidates[candidates.length-1];
}

function createWeightedSequence(length,targetSpecificity){
  const sequence=[],recent=[];
  for(let i=0;i<length;i++){
    const tier=chooseSpecificityTier(targetSpecificity);
    const pool=topicsBySpecificity[tier].length?topicsBySpecificity[tier]:topics;
    const chosen=weightedChoice(pool,new Set(recent));
    sequence.push(chosen.name);recent.push(chosen.id);
    if(recent.length>RECENT_TOPIC_GAP)recent.shift();
  }
  return sequence;
}

function targetSpecificityForRow(index,count){
  if(count<=1)return 3;
  const verticalProgress=index/(count-1);
  return 1+verticalProgress*4;
}

function fillTopicGroup(group,list){
  const fragment=document.createDocumentFragment();
  list.forEach(topic=>{
    const t=document.createElement("span");t.className="topic";t.textContent=topic;
    const s=document.createElement("span");s.className="separator";s.textContent="•";s.setAttribute("aria-hidden","true");
    fragment.append(t,s);
  });
  group.replaceChildren(fragment);
}

function speedFactorForRow(index){
  const pattern=[1,.92,1.08,.96,1.04,.9];
  return pattern[index%pattern.length];
}

function createBalancedDirections(count){
  const first=Math.random()<.5?-1:1,directions=[];
  for(let i=0;i<count;i++){
    const preferred=i%2===0?first:-first;
    directions.push(Math.random()<.72?preferred:-preferred);
  }
  if(count>1&&directions.every(d=>d===directions[0]))directions[directions.length-1]*=-1;
  return directions;
}

function createTickerRow(index,direction,rowCount){
  const viewport=document.createElement("div");viewport.className="ticker-viewport";
  const track=document.createElement("div");track.className="ticker-track";
  const a=document.createElement("div");a.className="ticker-group";
  const b=document.createElement("div");b.className="ticker-group";b.setAttribute("aria-hidden","true");
  track.append(a,b);viewport.append(track);tickerStack.append(viewport);
  const targetSpecificity=targetSpecificityForRow(index,rowCount);
  const rowTopics=createWeightedSequence(ROW_SEQUENCE_LENGTH,targetSpecificity);
  fillTopicGroup(a,rowTopics);fillTopicGroup(b,rowTopics);
  return{track,groupA:a,offset:0,width:0,direction,speedFactor:speedFactorForRow(index),randomPhase:Math.random(),targetSpecificity};
}

function buildTicker(){
  tickerStack.replaceChildren();tickerRows.length=0;
  const count=calculateRowCount(),directions=createBalancedDirections(count);
  tickerStack.style.gridTemplateRows=`repeat(${count},minmax(0,1fr))`;
  for(let i=0;i<count;i++)tickerRows.push(createTickerRow(i,directions[i],count));
  requestAnimationFrame(remeasureTicker);
  if(DEBUG){
    console.table(tickerRows.map((row,index)=>({row:index+1,targetSpecificity:row.targetSpecificity.toFixed(2)})));
    console.table(topicsBySpecificity.slice(1).map((pool,index)=>({specificityTier:index+1,topics:pool.length})));
  }
}

function animateTicker(timestamp){
  const elapsed=Math.min((timestamp-previousTimestamp)/1000,.1);
  previousTimestamp=timestamp;
  if(!isPaused){
    const base=tickerSpeed();
    tickerRows.forEach(row=>{
      row.offset+=row.direction*base*row.speedFactor*elapsed;
      if(row.width>0){
        if(row.direction<0&&row.offset<=-row.width)row.offset+=row.width;
        if(row.direction>0&&row.offset>=0)row.offset-=row.width;
      }
      row.track.style.transform=`translate3d(${row.offset}px,0,0)`;
    });
  }
  requestAnimationFrame(animateTicker);
}

function remeasureTicker(){
  tickerRows.forEach(row=>{
    row.width=row.groupA.getBoundingClientRect().width;
    if(row.width>0){
      row.offset=-row.randomPhase*row.width;
      row.track.style.transform=`translate3d(${row.offset}px,0,0)`;
    }
  });
}

function fullscreenActive(){return Boolean(document.fullscreenElement||document.webkitFullscreenElement)}
async function toggleFullscreen(){
  try{
    if(fullscreenActive()){
      if(document.exitFullscreen)await document.exitFullscreen();
      else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
      if(screen.orientation?.unlock)screen.orientation.unlock();
    }else{
      const root=document.documentElement;
      if(root.requestFullscreen)await root.requestFullscreen();
      else if(root.webkitRequestFullscreen)root.webkitRequestFullscreen();
      if(screen.orientation?.lock){try{await screen.orientation.lock("portrait")}catch{}}
    }
  }catch{}
}

function pointerDown(e){
  if(e.pointerType==="mouse"&&e.button!==0)return;
  activePointers.add(e.pointerId);isPaused=true;
}
function pointerEnd(e){
  if(!activePointers.has(e.pointerId))return;
  activePointers.delete(e.pointerId);isPaused=activePointers.size>0;
  const now=performance.now(),distance=Math.hypot(e.clientX-lastTapX,e.clientY-lastTapY);
  if(now-lastTapTime<=doubleTapDelay&&distance<=doubleTapDistance){lastTapTime=0;void toggleFullscreen()}
  else{lastTapTime=now;lastTapX=e.clientX;lastTapY=e.clientY}
}
function pointerCancel(e){activePointers.delete(e.pointerId);isPaused=activePointers.size>0}
function handleResize(){
  cancelAnimationFrame(rebuildFrame);
  rebuildFrame=requestAnimationFrame(()=>{
    const expected=calculateRowCount();
    if(expected!==tickerRows.length)buildTicker();else remeasureTicker();
  });
}

buildTicker();requestAnimationFrame(animateTicker);
window.addEventListener("resize",handleResize);
document.addEventListener("pointerdown",pointerDown,{passive:true});
document.addEventListener("pointerup",pointerEnd,{passive:true});
document.addEventListener("pointercancel",pointerCancel,{passive:true});
document.addEventListener("fullscreenchange",handleResize);
document.addEventListener("webkitfullscreenchange",handleResize);
</script>
