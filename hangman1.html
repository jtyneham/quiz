<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Hangman — Custom Keyboard Test Branch</title>
<style>
  :root{
    --bg:#f5f6f8;
    --surface:#ffffff;
    --text:#1f2329;
    --muted:#737b86;
    --line:#dfe3e8;
    --accent:#2f6fed;
    --accent-soft:#edf3ff;
    --danger:#b84141;
    --success:#2d7d46;
    --app-height:100svh;
    height:100dvh;
    --shadow:0 0.375rem 1.375rem rgba(25,32,45,.08);
  }

  *{box-sizing:border-box}
  html,body{height:100%}

  body{
    margin:0;
    width:100%;
    height:var(--app-height);
    overflow:hidden;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  button,input{font:inherit}

  .app{
    width:100%;
    height:var(--app-height);
    min-height:var(--app-height);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    margin:0;
    padding:0;
  }

  .game-card{
    flex:1;
    width:100%;
    height:var(--app-height);
    min-height:0;
    background:var(--surface);
    padding:clamp(0.6rem,1.6svh,1.2rem) clamp(0.7rem,2.8vw,1.6rem);
    display:grid;
    grid-template-rows:
      auto
      minmax(0, 33svh)
      minmax(0, 18svh)
      auto
      auto
      auto;
    gap:clamp(0.35rem,1.2svh,0.85rem);
    overflow:hidden;
  }

  .fullscreen-btn{
    display:grid;
    place-items:center;
    width:clamp(2.25rem,6svh,2.8rem);
    aspect-ratio:1;
    padding:0;
    border:0;
    border-radius:0.75rem;
    background:#f2f4f7;
    color:var(--text);
    font-size:clamp(1.15rem,4vw,1.45rem);
    line-height:1;
    cursor:pointer;
    transition:transform .08s ease, background .18s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .fullscreen-btn:active{
    transform:scale(.97);
  }

  .status-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:0.75rem;
    color:var(--muted);
    font-size:.9rem;
    min-height:1.5rem;
  }



  .tries-text{
    font-size:clamp(0.95rem,3.6vw,1.2rem);
    font-weight:600;
    transition:color .18s ease;
  }

  .tries-text.warning{
    color:var(--danger);
    font-weight:750;
  }

  .hangman-wrap{
    min-height:0;
    display:grid;
    place-items:center;
    overflow:hidden;
  }

  .hangman{
    width:min(48vw,30svh);
    max-height:100%;
    height:auto;
    overflow:visible;
  }

  .hangman line,
  .hangman circle,
  .hangman path{
    stroke:var(--text);
    stroke-width:0.42rem;
    stroke-linecap:round;
    stroke-linejoin:round;
    fill:none;
    vector-effect:non-scaling-stroke;
  }

  .word-zone{
    min-height:0;
    display:grid;
    place-items:center;
    overflow:hidden;
  }

  .slots{
    width:100%;
    max-height:100%;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-end;
    align-content:center;
    gap:clamp(0.3rem,1svh,0.6rem) clamp(0.28rem,1.2vw,0.5rem);
    overflow:hidden;
  }

  .letter-slot{
    width:clamp(1.55rem,5.5vw,2.4rem);
    height:clamp(2.2rem,7svh,3.1rem);
    border-bottom:0.1875rem solid var(--text);
    display:flex;
    justify-content:center;
    align-items:flex-end;
    padding-bottom:0.25rem;
    font-size:clamp(1.15rem,4.8vw,2rem);
    font-weight:700;
    line-height:1;
    text-transform:uppercase;
  }


  .slots.win .letter-slot{
    color:var(--success);
    border-bottom-color:var(--success);
  }

  .slots.loss .letter-slot{
    color:var(--danger);
    border-bottom-color:var(--danger);
  }

  .letter-slot.correct-hit{
    color:var(--success);
    border-bottom-color:var(--success);
    animation:correctPulse .32s ease;
  }

  .game-card.wrong-flash{
    animation:wrongFlash .28s ease;
  }

  @keyframes correctPulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.045)}
    100%{transform:scale(1)}
  }

  @keyframes wrongFlash{
    0%{background:var(--surface)}
    50%{background:#fff5f5}
    100%{background:var(--surface)}
  }

  .space-slot{
    width:clamp(0.7rem,3vw,1.25rem);
    height:clamp(2.2rem,7svh,3.1rem);
  }

  .punct{
    width:auto;
    min-width:0.5rem;
    height:clamp(2.2rem,7svh,3.1rem);
    display:flex;
    align-items:flex-end;
    padding-bottom:0.25rem;
    font-size:clamp(1.1rem,4.5vw,1.9rem);
    font-weight:700;
  }

  .misses{
    min-height:0;
    text-align:center;
  }

  .misses-label{
    color:var(--muted);
    font-size:.8rem;
    text-transform:uppercase;
    letter-spacing:.09em;
    margin-bottom:0.5625rem;
  }

  .misses-list{
    min-height:1.625rem;
    font-size:1.05rem;
    font-weight:650;
    letter-spacing:.16em;
  }

  .solve-panel{
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .solve-form{
    width:min(32.5rem,100%);
    display:none;
    gap:0.625rem;
    align-items:center;
  }

  .solve-form.open{display:grid; grid-template-columns:1fr auto auto}

  .solve-input{
    width:100%;
    border:0.0625rem solid var(--line);
    border-radius:0.8125rem;
    padding:0.8125rem 0.875rem;
    outline:none;
    background:#fff;
  }

  .solve-input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 0.1875rem var(--accent-soft);
  }

  .controls{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:0.625rem;
  }

  .btn{
    border:none;
    border-radius:0.8125rem;
    min-height:clamp(2.5rem,6svh,2.875rem);
    padding:0 clamp(0.8rem,3vw,1.125rem);
    cursor:pointer;
    font-weight:700;
    transition:transform .08s ease, background .18s ease, box-shadow .18s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .btn:active{transform:scale(.985)}

  .btn-primary{
    background:var(--accent);
    color:#fff;
    box-shadow:0 0.25rem 0.75rem rgba(47,111,237,.24);
  }

  .btn-secondary{
    background:var(--accent-soft);
    color:var(--accent);
  }

  .btn-ghost{
    background:#f2f4f7;
    color:var(--text);
  }

  .btn-danger{
    background:#fff1f1;
    color:var(--danger);
  }

  .message{
    min-height:1.5rem;
    text-align:center;
    font-size:.95rem;
    color:var(--muted);
  }

  .message.success{color:var(--success); font-weight:700}
  .message.danger{color:var(--danger); font-weight:700}

  .hidden-input{
    position:fixed;
    left:-625rem;
    top:-625rem;
    opacity:0;
  }

  @media (orientation:portrait){
    .game-card{
      padding:
        clamp(0.45rem,1.2svh,0.8rem)
        clamp(0.65rem,2.7vw,1rem);
      grid-template-rows:
        auto
        minmax(0, 32svh)
        minmax(0, 19svh)
        auto
        auto
        auto;
      gap:clamp(0.28rem,0.9svh,0.65rem);
    }

    .hangman{
      width:min(54vw, 29svh);
    }

    .fullscreen-btn{
    display:grid;
    place-items:center;
    width:clamp(2.25rem,6svh,2.8rem);
    aspect-ratio:1;
    padding:0;
    border:0;
    border-radius:0.75rem;
    background:#f2f4f7;
    color:var(--text);
    font-size:clamp(1.15rem,4vw,1.45rem);
    line-height:1;
    cursor:pointer;
    transition:transform .08s ease, background .18s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .fullscreen-btn:active{
    transform:scale(.97);
  }

  .status-row{
      min-height:0;
      font-size:clamp(0.72rem,2.8vw,0.9rem);
    }

    .misses-label{
      margin-bottom:clamp(0.2rem,0.7svh,0.45rem);
    }

    .misses-list{
      min-height:0;
      font-size:clamp(0.9rem,3.7vw,1.05rem);
    }

    .message{
      min-height:0;
      font-size:clamp(0.78rem,3vw,0.95rem);
    }

    .controls{
      gap:clamp(0.4rem,1.5vw,0.625rem);
    }

    .solve-form.open{
      grid-template-columns:1fr 1fr;
    }

    .solve-input{
      grid-column:1 / -1;
      padding:clamp(0.65rem,1.7svh,0.8125rem) clamp(0.75rem,3vw,0.875rem);
    }

    .solve-form .btn{
      width:100%;
    }
  }

  @media (orientation:portrait) and (max-height:36em){
    .game-card{
      grid-template-rows:
        auto
        minmax(0, 29svh)
        minmax(0, 17svh)
        auto
        auto
        auto;
      gap:0.3rem;
    }

    .hangman{
      width:min(48vw, 25svh);
    }

    .letter-slot{
      height:clamp(1.9rem,6svh,2.5rem);
      font-size:clamp(1rem,4.3vw,1.6rem);
    }

    .space-slot,
    .punct{
      height:clamp(1.9rem,6svh,2.5rem);
    }
  }


  /* Software keyboard mode.
     Use a vertical flex flow instead of grid rows so sections can never overlap. */
  body.keyboard-open .game-card{
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    height:var(--app-height);
    min-height:0;
    gap:clamp(0.18rem,0.65svh,0.42rem);
    padding:
      clamp(0.28rem,0.75svh,0.55rem)
      clamp(0.65rem,2.7vw,1rem)
      clamp(0.22rem,0.65svh,0.48rem);
    overflow:hidden;
  }

  body.keyboard-open .status-row{
    flex:0 0 auto;
    min-height:0;
  }

  body.keyboard-open .hangman-wrap{
    flex:1 1 auto;
    min-height:clamp(6.2rem,18svh,9.2rem);
    max-height:clamp(8rem,25svh,12rem);
    display:grid;
    place-items:center;
    overflow:visible;
  }

  body.keyboard-open .hangman{
    height:100%;
    width:auto;
    max-width:52vw;
    max-height:100%;
    overflow:visible;
    display:block;
  }

  body.keyboard-open .word-zone{
    flex:0 0 auto;
    min-height:clamp(3.2rem,10svh,4.8rem);
    overflow:visible;
  }

  body.keyboard-open .slots{
    max-height:none;
  }

  body.keyboard-open .letter-slot{
    width:clamp(1.35rem,5vw,2.1rem);
    height:clamp(1.9rem,5.8svh,2.6rem);
    font-size:clamp(1rem,4.2vw,1.7rem);
  }

  body.keyboard-open .space-slot,
  body.keyboard-open .punct{
    height:clamp(1.9rem,5.8svh,2.6rem);
  }

  body.keyboard-open .feedback-zone{
    flex:0 0 auto;
  }

  body.keyboard-open .misses-label{
    margin-bottom:clamp(0.1rem,0.35svh,0.25rem);
  }

  body.keyboard-open .message{
    display:none;
  }

  /* Normal letter-guess keyboard mode. */
  body.keyboard-open:not(.solve-mode-layout) .solve-panel,
  body.keyboard-open:not(.solve-mode-layout) .controls{
    display:none;
  }

  /* Solve mode remains explicit and survives Android focus/resize quirks. */
  body.solve-mode-layout .controls{
    display:none;
  }

  body.solve-mode-layout .solve-panel{
    display:flex;
  }

  body.keyboard-open.solve-mode-layout .hangman-wrap{
    min-height:clamp(5.4rem,15svh,7.8rem);
    max-height:clamp(6.8rem,20svh,9.2rem);
  }

  body.keyboard-open.solve-mode-layout .hangman{
    height:100%;
    width:auto;
    max-width:46vw;
    max-height:100%;
    overflow:visible;
  }

  body.keyboard-open.solve-mode-layout .word-zone{
    min-height:clamp(2.8rem,8svh,4rem);
  }

  body.keyboard-open.solve-mode-layout .feedback-zone{
    flex:0 0 auto;
  }

  body.keyboard-open.solve-mode-layout .solve-panel{
    flex:0 0 auto;
    min-height:0;
    width:100%;
  }

  body.keyboard-open.solve-mode-layout .solve-form.open{
    width:min(94vw,32.5rem);
  }



  /* Compact Solve Word controls only. Keep normal letter-entry layout unchanged. */
  body.keyboard-open.solve-mode-layout .solve-panel{
    flex:0 0 auto;
    width:100%;
    padding-bottom:max(env(safe-area-inset-bottom),0.2rem);
  }

  body.keyboard-open.solve-mode-layout .solve-form.open{
    width:min(94vw,32.5rem);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:clamp(0.28rem,0.7svh,0.45rem);
    align-items:center;
  }

  body.keyboard-open.solve-mode-layout .solve-input{
    grid-column:1 / -1;
    min-height:clamp(2.45rem,5.4svh,2.8rem);
    padding:
      clamp(0.42rem,1.05svh,0.62rem)
      clamp(0.7rem,2.6vw,0.9rem);
  }

  body.keyboard-open.solve-mode-layout .solve-form .btn{
    width:100%;
    min-height:clamp(2.3rem,5svh,2.65rem);
    padding:0 clamp(0.65rem,2.4vw,0.9rem);
  }



  .status-row{
    position:relative;
  }

  .topics-btn{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:0.45rem;
    min-height:clamp(2.25rem,6svh,2.8rem);
    padding:0 clamp(0.7rem,2.4vw,1rem);
    border:0;
    border-radius:0.75rem;
    background:#f2f4f7;
    color:var(--text);
    font-weight:700;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }

  .topics-btn:active{
    transform:translateX(-50%) scale(.98);
  }

  .topics-count{
    display:grid;
    place-items:center;
    min-width:1.7em;
    height:1.7em;
    padding:0 0.35em;
    border-radius:999rem;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.78em;
    line-height:1;
  }

  .topics-overlay{
    position:fixed;
    inset:0;
    z-index:50;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(20,24,31,.34);
    padding:max(env(safe-area-inset-top),0.6rem) 0 0;
  }

  .topics-overlay.open{
    display:flex;
  }

  .topics-sheet{
    width:min(100%,44rem);
    max-height:min(88svh,46rem);
    display:flex;
    flex-direction:column;
    background:var(--surface);
    border-radius:1.25rem 1.25rem 0 0;
    padding:
      clamp(0.9rem,2.2svh,1.2rem)
      clamp(0.85rem,3vw,1.25rem)
      max(env(safe-area-inset-bottom),0.9rem);
    box-shadow:0 -0.4rem 1.6rem rgba(25,32,45,.14);
  }

  .topics-sheet-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:1rem;
  }

  .topics-title{
    font-size:clamp(1.15rem,4vw,1.45rem);
    font-weight:800;
  }

  .topics-subtitle{
    margin-top:0.2rem;
    color:var(--muted);
    font-size:clamp(0.78rem,2.8vw,0.92rem);
  }

  .topics-close{
    display:grid;
    place-items:center;
    width:2.35rem;
    aspect-ratio:1;
    border:0;
    border-radius:50%;
    background:#f2f4f7;
    color:var(--text);
    font-size:1.35rem;
    line-height:1;
    cursor:pointer;
  }

  .topics-actions-row{
    display:flex;
    gap:0.55rem;
    margin-top:0.9rem;
  }

  .topics-mini-btn{
    min-height:2.25rem;
    border:0;
    border-radius:0.7rem;
    padding:0 0.8rem;
    background:#f2f4f7;
    color:var(--text);
    font-weight:700;
    cursor:pointer;
  }

  .topics-grid{
    flex:1;
    min-height:0;
    overflow-y:auto;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:0.55rem;
    margin-top:0.8rem;
    padding-right:0.1rem;
    overscroll-behavior:contain;
  }

  .topic-chip{
    position:relative;
    display:flex;
    align-items:center;
    min-height:3rem;
    border:0.0625rem solid var(--line);
    border-radius:0.8rem;
    padding:0.7rem 0.8rem;
    background:var(--surface);
    color:var(--text);
    text-align:left;
    font-weight:650;
    cursor:pointer;
    transition:
      background .16s ease,
      border-color .16s ease,
      color .16s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .topic-chip.selected{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
  }

  .topic-chip.selected::after{
    content:"✓";
    margin-left:auto;
    padding-left:0.5rem;
    font-weight:850;
  }

  .topics-footer{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0.6rem;
    margin-top:0.85rem;
  }

  .topics-footer .btn{
    width:100%;
  }

  @media (min-width:40em){
    .topics-grid{
      grid-template-columns:repeat(3,minmax(0,1fr));
    }

    .topics-sheet{
      border-radius:1.25rem;
      margin:auto;
    }

    .topics-overlay{
      align-items:center;
      padding:max(env(safe-area-inset-top),1rem) 1rem max(env(safe-area-inset-bottom),1rem);
    }
  }


  .game-card{
    grid-template-rows:auto minmax(0,1fr) auto auto auto auto auto;
    gap:clamp(.2rem,.75svh,.55rem);
  }
  .status-row{position:relative}
  .hidden-input{display:none!important}
  .solve-display{
    width:min(92vw,32rem);
    min-height:2.65rem;
    display:none;
    align-items:center;
    padding:.5rem .8rem;
    border:.0625rem solid var(--line);
    border-radius:.8rem;
    background:#fff;
    font-size:clamp(1rem,4vw,1.25rem);
    font-weight:650;
    letter-spacing:.035em;
    white-space:nowrap;
    overflow:hidden;
  }
  .solve-display.open{display:flex}
  .custom-keyboard{
    width:100%;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:clamp(.2rem,.55svh,.38rem);
    padding:clamp(.3rem,.7svh,.5rem) clamp(.22rem,.8vw,.45rem) max(env(safe-area-inset-bottom),.3rem);
    background:#eef2f6;
    border-radius:1rem 1rem 0 0;
  }
  .kb-row{display:flex;justify-content:center;gap:clamp(.16rem,.55vw,.36rem)}
  .kb-middle{padding-inline:clamp(.6rem,3.4vw,2rem)}
  .kb-key{
    flex:1 1 0;
    min-width:0;
    height:clamp(2.2rem,5.6svh,3.2rem);
    border:0;
    border-radius:.55rem;
    background:#fff;
    color:#17191d;
    font-size:clamp(.88rem,3.4vw,1.22rem);
    font-weight:650;
    box-shadow:0 .07rem .16rem rgba(0,0,0,.12);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .06s ease,background .15s ease,color .15s ease,opacity .15s ease;
  }
  .kb-key:active{transform:scale(.96)}
  .kb-key.guessed-correct{background:#e6f4ea;color:var(--success)}
  .kb-key.guessed-wrong{background:#fdeaea;color:var(--danger)}
  .kb-key.used{opacity:.5;pointer-events:none}
  @media (orientation:portrait){
    .game-card{
      grid-template-rows:auto minmax(0,28svh) minmax(0,10svh) auto auto auto auto;
      gap:clamp(.16rem,.5svh,.36rem);
    }
    .hangman{width:min(58vw,27svh)}
    .word-zone{min-height:0}
    .letter-slot{height:clamp(1.9rem,5.6svh,2.7rem)}
    .space-slot,.punct{height:clamp(1.9rem,5.6svh,2.7rem)}
  }


  /* Revised custom keyboard deck */
  .custom-keyboard{
    background:#e5eaf0;
    padding:
      clamp(.48rem,1.05svh,.72rem)
      clamp(.22rem,.8vw,.45rem)
      max(env(safe-area-inset-bottom),.32rem);
    gap:clamp(.18rem,.48svh,.34rem);
    flex:0 0 auto;
    align-self:end;
  }

  .kb-row{
    gap:clamp(.14rem,.5vw,.32rem);
  }

  .kb-key{
    box-shadow:
      0 .08rem .16rem rgba(0,0,0,.14),
      0 .02rem .04rem rgba(0,0,0,.1);
    transition:
      transform .05s ease,
      background .12s ease,

  function getActivePool(){
    if(randomMode){
      const allowed=new Set(RANDOM_POOL);
      return GAME_DATABASE.filter(e=>allowed.has(e.answer));

  function pickWord(){
    const p=getActivePool();
    if(!p.length) return "";
    let n=p[Math.floor(Math.random()*p.length)].answer;
    if(p.length>1&&n===answer){
      let i=p.findIndex(e=>e.answer===n);
      n=p[(i+1)%p.length].answer;

    return n;

      slots.appendChild(el);
    }
    missesList.textContent=misses.length?misses.join(" · "):"";
    triesText.textContent=`${wrongCount} / 6 misses`;
    triesText.classList.toggle("warning",wrongCount>=4);
    for(let i=1;i<=6;i++) document.getElementById("s"+i)?.classList.toggle("show",i<=wrongCount);
    document.querySelector(".hangman")?.classList.toggle("head-revealed", wrongCount >= 1);
    document.querySelector(".hangman")?.classList.toggle("game-over", wrongCount >= 6);
  }
  document.querySelectorAll(".draw-part").forEach(part=>{
    part.addEventListener("animationend",()=>{
      if(part.classList.contains("show")) part.classList.add("drawn");
    });
  });

  function solved(){ return uniqueLetters(answer).every(l=>guessed.has(l)); }
  function finishWin(){
    uniqueLetters(answer).forEach(l=>guessed.add(l)); active=false; solveMode=false;
    solveBtn.style.display="none"; solveUi.classList.remove("open"); keyboard.classList.remove("solve-mode"); gameCard.classList.remove("solve-active");
    newWordBtn.hidden=false;
    message.className="message success"; message.textContent="Correct."; slots.classList.add("win");
    vibrate([45,35,70]); render();
  }
  function finishLoss(){
    uniqueLetters(answer).forEach(l=>guessed.add(l)); active=false; solveMode=false;
    solveBtn.style.display="none"; solveUi.classList.remove("open"); keyboard.classList.remove("solve-mode"); gameCard.classList.remove("solve-active");
    newWordBtn.hidden=false;
    message.className="message danger"; message.textContent=`The answer was ${answer}.`;
    slots.classList.add("loss"); vibrate([120,60,120]); flashWrong(); render();
  }
  function wrongGuess(text){
    wrongCount++; vibrate(90); flashWrong(); render();
    if(wrongCount>=6) finishLoss(); else {message.className="message";message.textContent=text;}
  }
  function guessLetter(letter){
    if(!active||solveMode||guessed.has(letter)||misses.includes(letter)) return;
    const key=keyboard.querySelector(`[data-key="${letter}"]`);
    if(answer.includes(letter)){
      guessed.add(letter); key?.classList.add("guessed-correct","used"); render(); pulseCorrect(letter);
      if(solved()) finishWin();
    } else {
      misses.push(letter); key?.classList.add("guessed-wrong","used"); wrongGuess(`${letter} is not in the word.`);
    }
  }
  function updateSolve(){
    solveText.textContent=solveBuffer;
  }

  function enterSolve(){
    if(!active) return;
    solveMode=true;
    solveBuffer="";
    keyboard.classList.add("solve-mode");
    solveUi.classList.add("open");
    solveBtn.style.display="none";
    newWordBtn.hidden=true;
    message.textContent="";
    updateSolve();
  }

  function leaveSolve(){
    solveMode=false;
    solveBuffer="";
    keyboard.classList.remove("solve-mode");
    solveUi.classList.remove("open");
    solveBtn.style.display="";
    newWordBtn.hidden=false;
    message.textContent="";
  }

  function submitSolve(){
    const attempt=solveBuffer.trim().replace(/\s+/g," ").toUpperCase();
    if(!attempt) return;
    if(attempt===answer) finishWin(); else { leaveSolve(); wrongGuess("Wrong solution. One miss added."); }
  }

  keyboard.addEventListener("click",e=>{
    const key=e.target.closest(".kb-key");
    if(!key||!active) return;

    const v=key.dataset.key;

    /* Short, crisp haptic pulse closer to a phone keyboard tap. */
    vibrate(v==="ENTER" ? ENTER_HAPTIC_MS : KEY_HAPTIC_MS);

    key.classList.remove("key-pressed");
    void key.offsetWidth;
    key.classList.add("key-pressed");
    setTimeout(()=>key.classList.remove("key-pressed"),82);

    showKeyPopup(key,v);

    if(!solveMode){
      if(/^[A-Z]$/.test(v)) guessLetter(v);
      /* Backspace, Space and Enter intentionally do nothing here. */
      return;
    }

    if(/^[A-Z]$/.test(v)) solveBuffer+=v;
    else if(v==="SPACE" && solveBuffer && !solveBuffer.endsWith(" ")) solveBuffer+=" ";
    else if(v==="BACKSPACE") solveBuffer=solveBuffer.slice(0,-1);
    else if(v==="ENTER"){
      submitSolve();
      return;
    }

    updateSolve();
  });

  solveBtn.addEventListener("click",enterSolve);
  solveCancelBtn.addEventListener("click",leaveSolve);
  newWordBtn.addEventListener("click",()=>{
    if(!active){ startRound(); return; }
    if(!confirmNewWord){
      confirmNewWord=true; newWordBtn.textContent="New Word?"; newWordBtn.className="btn btn-danger";
      clearTimeout(confirmTimer);
      confirmTimer=setTimeout(()=>{confirmNewWord=false;newWordBtn.textContent="New Word";newWordBtn.className="btn btn-primary";},2200);
      return;
    }
    startRound();
  });
  topicsBtn.addEventListener("click",openTopics);topicsClose.addEventListener("click",closeTopics);cancelTopics.addEventListener("click",closeTopics);
  selectAllTopics.addEventListener("click",()=>{draftRandomMode=false;draftTopics=new Set(TOPICS);renderTopicChoices();});
  clearTopics.addEventListener("click",()=>{draftRandomMode=false;draftTopics.clear();renderTopicChoices();});
  applyTopics.addEventListener("click",applyTopicSelection);
  topicsOverlay.addEventListener("click",e=>{if(e.target===topicsOverlay)closeTopics();});

  fullscreenBtn.addEventListener("click",async()=>{
    try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); }catch(e){}
  });
  document.addEventListener("fullscreenchange",()=>{
    const on=Boolean(document.fullscreenElement);
    fullscreenBtn.textContent=on?"×":"⛶";
    fullscreenBtn.setAttribute("aria-label",on?"Exit fullscreen":"Enter fullscreen");
  });
  updateTopicsLabel();
  startRound();
})();

</script>
</body>
</html>
