<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Hangman Mockup</title>
<style>
  :root{
    --bg:#f5f6f8;
    --surface:#ffffff;
    --text:#1f2329;
    --muted:#737b86;
    --line:#dfe3e8;
    --accent:#2f6fed;
    --accent-soft:#edf3ff;
    --danger:#b84141;
    --success:#2d7d46;
    --app-height:100svh;
    --shadow:0 0.375rem 1.375rem rgba(25,32,45,.08);
  }

  *{box-sizing:border-box}
  html,body{height:100%}

  body{
    margin:0;
    width:100%;
    height:var(--app-height);
    overflow:hidden;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  button,input{font:inherit}

  .app{
    width:100%;
    height:var(--app-height);
    min-height:var(--app-height);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    margin:0;
    padding:0;
  }

  .game-card{
    flex:1;
    width:100%;
    height:var(--app-height);
    min-height:0;
    background:var(--surface);
    padding:clamp(0.6rem,1.6svh,1.2rem) clamp(0.7rem,2.8vw,1.6rem);
    display:grid;
    grid-template-rows:
      auto
      minmax(0, 33svh)
      minmax(0, 18svh)
      auto
      auto
      auto;
    gap:clamp(0.35rem,1.2svh,0.85rem);
    overflow:hidden;
  }

  .fullscreen-btn{
    display:grid;
    place-items:center;
    width:clamp(2.25rem,6svh,2.8rem);
    aspect-ratio:1;
    padding:0;
    border:0;
    border-radius:0.75rem;
    background:#f2f4f7;
    color:var(--text);
    font-size:clamp(1.15rem,4vw,1.45rem);
    line-height:1;
    cursor:pointer;
    transition:transform .08s ease, background .18s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .fullscreen-btn:active{
    transform:scale(.97);
  }

  .status-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:0.75rem;
    color:var(--muted);
    font-size:.9rem;
    min-height:1.5rem;
  }



  .tries-text{
    font-size:clamp(0.95rem,3.6vw,1.2rem);
    font-weight:600;
    transition:color .18s ease;
  }

  .tries-text.warning{
    color:var(--danger);
    font-weight:750;
  }

  .hangman-wrap{
    min-height:0;
    display:grid;
    place-items:center;
    overflow:hidden;
  }

  .hangman{
    width:min(48vw,30svh);
    max-height:100%;
    height:auto;
    overflow:visible;
  }

  .hangman line,
  .hangman circle,
  .hangman path{
    stroke:var(--text);
    stroke-width:0.42rem;
    stroke-linecap:round;
    stroke-linejoin:round;
    fill:none;
    vector-effect:non-scaling-stroke;
  }

  .stage{
    opacity:0;
    transition:opacity .24s ease;
  }

  .stage.show{opacity:1}

  .word-zone{
    min-height:0;
    display:grid;
    place-items:center;
    overflow:hidden;
  }

  .slots{
    width:100%;
    max-height:100%;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-end;
    align-content:center;
    gap:clamp(0.3rem,1svh,0.6rem) clamp(0.28rem,1.2vw,0.5rem);
    overflow:hidden;
  }

  .letter-slot{
    width:clamp(1.55rem,5.5vw,2.4rem);
    height:clamp(2.2rem,7svh,3.1rem);
    border-bottom:0.1875rem solid var(--text);
    display:flex;
    justify-content:center;
    align-items:flex-end;
    padding-bottom:0.25rem;
    font-size:clamp(1.15rem,4.8vw,2rem);
    font-weight:700;
    line-height:1;
    text-transform:uppercase;
  }


  .slots.win .letter-slot{
    color:var(--success);
    border-bottom-color:var(--success);
  }

  .slots.loss .letter-slot{
    color:var(--danger);
    border-bottom-color:var(--danger);
  }

  .letter-slot.correct-hit{
    color:var(--success);
    border-bottom-color:var(--success);
    animation:correctPulse .32s ease;
  }

  .game-card.wrong-flash{
    animation:wrongFlash .28s ease;
  }

  @keyframes correctPulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.045)}
    100%{transform:scale(1)}
  }

  @keyframes wrongFlash{
    0%{background:var(--surface)}
    50%{background:#fff5f5}
    100%{background:var(--surface)}
  }

  .space-slot{
    width:clamp(0.7rem,3vw,1.25rem);
    height:clamp(2.2rem,7svh,3.1rem);
  }

  .punct{
    width:auto;
    min-width:0.5rem;
    height:clamp(2.2rem,7svh,3.1rem);
    display:flex;
    align-items:flex-end;
    padding-bottom:0.25rem;
    font-size:clamp(1.1rem,4.5vw,1.9rem);
    font-weight:700;
  }

  .misses{
    min-height:0;
    text-align:center;
  }

  .misses-label{
    color:var(--muted);
    font-size:.8rem;
    text-transform:uppercase;
    letter-spacing:.09em;
    margin-bottom:0.5625rem;
  }

  .misses-list{
    min-height:1.625rem;
    font-size:1.05rem;
    font-weight:650;
    letter-spacing:.16em;
  }

  .solve-panel{
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .solve-form{
    width:min(32.5rem,100%);
    display:none;
    gap:0.625rem;
    align-items:center;
  }

  .solve-form.open{display:grid; grid-template-columns:1fr auto auto}

  .solve-input{
    width:100%;
    border:0.0625rem solid var(--line);
    border-radius:0.8125rem;
    padding:0.8125rem 0.875rem;
    outline:none;
    background:#fff;
  }

  .solve-input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 0.1875rem var(--accent-soft);
  }

  .controls{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:0.625rem;
  }

  .btn{
    border:none;
    border-radius:0.8125rem;
    min-height:clamp(2.5rem,6svh,2.875rem);
    padding:0 clamp(0.8rem,3vw,1.125rem);
    cursor:pointer;
    font-weight:700;
    transition:transform .08s ease, background .18s ease, box-shadow .18s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .btn:active{transform:scale(.985)}

  .btn-primary{
    background:var(--accent);
    color:#fff;
    box-shadow:0 0.25rem 0.75rem rgba(47,111,237,.24);
  }

  .btn-secondary{
    background:var(--accent-soft);
    color:var(--accent);
  }

  .btn-ghost{
    background:#f2f4f7;
    color:var(--text);
  }

  .btn-danger{
    background:#fff1f1;
    color:var(--danger);
  }

  .message{
    min-height:1.5rem;
    text-align:center;
    font-size:.95rem;
    color:var(--muted);
  }

  .message.success{color:var(--success); font-weight:700}
  .message.danger{color:var(--danger); font-weight:700}

  .hidden-input{
    position:fixed;
    left:-625rem;
    top:-625rem;
    opacity:0;
  }

  @media (orientation:portrait){
    .game-card{
      padding:
        clamp(0.45rem,1.2svh,0.8rem)
        clamp(0.65rem,2.7vw,1rem);
      grid-template-rows:
        auto
        minmax(0, 32svh)
        minmax(0, 19svh)
        auto
        auto
        auto;
      gap:clamp(0.28rem,0.9svh,0.65rem);
    }

    .hangman{
      width:min(54vw, 29svh);
    }

    .fullscreen-btn{
    display:grid;
    place-items:center;
    width:clamp(2.25rem,6svh,2.8rem);
    aspect-ratio:1;
    padding:0;
    border:0;
    border-radius:0.75rem;
    background:#f2f4f7;
    color:var(--text);
    font-size:clamp(1.15rem,4vw,1.45rem);
    line-height:1;
    cursor:pointer;
    transition:transform .08s ease, background .18s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .fullscreen-btn:active{
    transform:scale(.97);
  }

  .status-row{
      min-height:0;
      font-size:clamp(0.72rem,2.8vw,0.9rem);
    }

    .misses-label{
      margin-bottom:clamp(0.2rem,0.7svh,0.45rem);
    }

    .misses-list{
      min-height:0;
      font-size:clamp(0.9rem,3.7vw,1.05rem);
    }

    .message{
      min-height:0;
      font-size:clamp(0.78rem,3vw,0.95rem);
    }

    .controls{
      gap:clamp(0.4rem,1.5vw,0.625rem);
    }

    .solve-form.open{
      grid-template-columns:1fr 1fr;
    }

    .solve-input{
      grid-column:1 / -1;
      padding:clamp(0.65rem,1.7svh,0.8125rem) clamp(0.75rem,3vw,0.875rem);
    }

    .solve-form .btn{
      width:100%;
    }
  }

  @media (orientation:portrait) and (max-height:36em){
    .game-card{
      grid-template-rows:
        auto
        minmax(0, 29svh)
        minmax(0, 17svh)
        auto
        auto
        auto;
      gap:0.3rem;
    }

    .hangman{
      width:min(48vw, 25svh);
    }

    .letter-slot{
      height:clamp(1.9rem,6svh,2.5rem);
      font-size:clamp(1rem,4.3vw,1.6rem);
    }

    .space-slot,
    .punct{
      height:clamp(1.9rem,6svh,2.5rem);
    }
  }


  /* Software keyboard mode.
     Use a vertical flex flow instead of grid rows so sections can never overlap. */
  body.keyboard-open .game-card{
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    height:var(--app-height);
    min-height:0;
    gap:clamp(0.18rem,0.65svh,0.42rem);
    padding:
      clamp(0.28rem,0.75svh,0.55rem)
      clamp(0.65rem,2.7vw,1rem)
      clamp(0.22rem,0.65svh,0.48rem);
    overflow:hidden;
  }

  body.keyboard-open .status-row{
    flex:0 0 auto;
    min-height:0;
  }

  body.keyboard-open .hangman-wrap{
    flex:1 1 auto;
    min-height:clamp(6.2rem,18svh,9.2rem);
    max-height:clamp(8rem,25svh,12rem);
    display:grid;
    place-items:center;
    overflow:visible;
  }

  body.keyboard-open .hangman{
    height:100%;
    width:auto;
    max-width:52vw;
    max-height:100%;
    overflow:visible;
    display:block;
  }

  body.keyboard-open .word-zone{
    flex:0 0 auto;
    min-height:clamp(3.2rem,10svh,4.8rem);
    overflow:visible;
  }

  body.keyboard-open .slots{
    max-height:none;
  }

  body.keyboard-open .letter-slot{
    width:clamp(1.35rem,5vw,2.1rem);
    height:clamp(1.9rem,5.8svh,2.6rem);
    font-size:clamp(1rem,4.2vw,1.7rem);
  }

  body.keyboard-open .space-slot,
  body.keyboard-open .punct{
    height:clamp(1.9rem,5.8svh,2.6rem);
  }

  body.keyboard-open .feedback-zone{
    flex:0 0 auto;
  }

  body.keyboard-open .misses-label{
    margin-bottom:clamp(0.1rem,0.35svh,0.25rem);
  }

  body.keyboard-open .message{
    display:none;
  }

  /* Normal letter-guess keyboard mode. */
  body.keyboard-open:not(.solve-mode-layout) .solve-panel,
  body.keyboard-open:not(.solve-mode-layout) .controls{
    display:none;
  }

  /* Solve mode remains explicit and survives Android focus/resize quirks. */
  body.solve-mode-layout .controls{
    display:none;
  }

  body.solve-mode-layout .solve-panel{
    display:flex;
  }

  body.keyboard-open.solve-mode-layout .hangman-wrap{
    min-height:clamp(5.4rem,15svh,7.8rem);
    max-height:clamp(6.8rem,20svh,9.2rem);
  }

  body.keyboard-open.solve-mode-layout .hangman{
    height:100%;
    width:auto;
    max-width:46vw;
    max-height:100%;
    overflow:visible;
  }

  body.keyboard-open.solve-mode-layout .word-zone{
    min-height:clamp(2.8rem,8svh,4rem);
  }

  body.keyboard-open.solve-mode-layout .feedback-zone{
    flex:0 0 auto;
  }

  body.keyboard-open.solve-mode-layout .solve-panel{
    flex:0 0 auto;
    min-height:0;
    width:100%;
  }

  body.keyboard-open.solve-mode-layout .solve-form.open{
    width:min(94vw,32.5rem);
  }



  /* Compact Solve Word controls only. Keep normal letter-entry layout unchanged. */
  body.keyboard-open.solve-mode-layout .solve-panel{
    flex:0 0 auto;
    width:100%;
    padding-bottom:max(env(safe-area-inset-bottom),0.2rem);
  }

  body.keyboard-open.solve-mode-layout .solve-form.open{
    width:min(94vw,32.5rem);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:clamp(0.28rem,0.7svh,0.45rem);
    align-items:center;
  }

  body.keyboard-open.solve-mode-layout .solve-input{
    grid-column:1 / -1;
    min-height:clamp(2.45rem,5.4svh,2.8rem);
    padding:
      clamp(0.42rem,1.05svh,0.62rem)
      clamp(0.7rem,2.6vw,0.9rem);
  }

  body.keyboard-open.solve-mode-layout .solve-form .btn{
    width:100%;
    min-height:clamp(2.3rem,5svh,2.65rem);
    padding:0 clamp(0.65rem,2.4vw,0.9rem);
  }

</style>
</head>
<body>
<div class="app">
  <main class="game-card" id="gameCard">
    <div class="status-row">
      <button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="Toggle fullscreen" title="Fullscreen">⛶</button>
      <span class="tries-text" id="triesText">0 / 6 misses</span>
    </div>

    <div class="hangman-wrap">
      <svg class="hangman" viewBox="0 0 300 225" preserveAspectRatio="xMidYMid meet" aria-label="Hangman drawing">
        <!-- gallows visible from the start -->
        <line x1="55" y1="205" x2="245" y2="205"/>
        <line x1="95" y1="205" x2="95" y2="28"/>
        <line x1="95" y1="28" x2="210" y2="28"/>
        <line x1="210" y1="28" x2="210" y2="55"/>

        <!-- six mistakes:
             1 head, 2 torso, 3 left arm, 4 right arm, 5 left leg, 6 right leg -->
        <circle class="stage" id="s1" cx="210" cy="77" r="22"/>
        <line class="stage" id="s2" x1="210" y1="99" x2="210" y2="151"/>
        <line class="stage" id="s3" x1="210" y1="115" x2="177" y2="138"/>
        <line class="stage" id="s4" x1="210" y1="115" x2="243" y2="138"/>
        <line class="stage" id="s5" x1="210" y1="151" x2="184" y2="190"/>
        <line class="stage" id="s6" x1="210" y1="151" x2="236" y2="190"/>
      </svg>
    </div>

    <section class="word-zone" id="wordZone" title="Tap here to type a letter">
      <div class="slots" id="slots"></div>
    </section>

    <div class="feedback-zone">
      <div class="misses">
        <div class="misses-label">Misses</div>
        <div class="misses-list" id="missesList">—</div>
      </div>
      <div class="message" id="message"></div>
    </div>

    <div class="solve-panel">
      <div class="solve-form" id="solveForm">
        <input class="solve-input" id="solveInput" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Type the full answer..." />
        <button class="btn btn-ghost" id="cancelSolve">Cancel</button>
        <button class="btn btn-primary" id="submitSolve">Solve</button>
      </div>
    </div>

    <div>
      <div class="controls">
        <button class="btn btn-secondary" id="solveBtn">Solve Word</button>
        <button class="btn btn-primary" id="newWordBtn">New Word</button>
      </div>
      
    </div>
  </main>
</div>

<input class="hidden-input" id="letterInput" inputmode="text" maxlength="1" autocomplete="off" autocapitalize="characters" />

<script>
(() => {
  const words = [
    "apple", "anchor", "animal", "artist", "autumn", "avocado", "balloon", "banana", "basket", "beacon",
    "beaver", "bicycle", "blanket", "blossom", "bottle", "bridge", "button", "cactus", "camera", "candle",

    "forest", "fossil", "garden", "garlic", "glacier", "guitar", "hammer", "harbor", "helmet", "honey",

    "fireplace", "football", "freezer", "garage", "grocery", "hallway", "headphones", "hospital", "kitchen", "library",
    "lighthouse", "mailbox", "museum", "notebook", "pancake", "playground", "popcorn", "restaurant", "sandwich", "school",
    "sidewalk", "snowman", "stadium", "suitcase", "supermarket", "telephone", "television", "toothbrush", "traffic", "umbrella",
    "adventure", "balance", "bargain", "beauty", "bravery", "breeze", "chance", "choice", "courage", "danger",
    "energy", "freedom", "friend", "future", "gravity", "harmony", "history", "journey", "laughter", "memory",
    "mystery", "nature", "patience", "peace", "promise", "rhythm", "secret", "silence", "strength", "surprise",

    "science", "culture", "music", "weather", "travel", "family", "holiday", "weekend", "summer", "winter",
    "astronaut", "bacteria", "battery", "compass", "dinosaur", "eclipse", "electricity", "galaxy", "geography", "internet",
    "microscope", "oxygen", "satellite", "skeleton", "telescope", "temperature", "triangle", "universe", "velocity", "website",
    "algorithm", "biology", "chemistry", "equator", "fraction", "geometry", "horizon", "latitude", "molecule", "orbit",
    "protein", "radiation", "species", "spectrum", "tornado", "vacuum", "vitamin", "wildlife", "earthquake", "ecosystem",

    "coffee shop", "dining room", "front door", "ice cream", "movie theater", "parking lot", "school bus", "swimming pool", "traffic light", "washing machine",

    "board game", "video game", "tennis court", "soccer ball", "basketball", "table tennis", "martial arts", "rock climbing", "roller coaster", "treasure map",
    "alarm clock", "birthday cake", "credit card", "fire engine", "frying pan", "garden hose", "guitar string", "light bulb", "paper plane", "pocket knife",
    "rubber duck", "shopping cart", "sleeping bag", "toilet paper", "water bottle", "winter coat", "wooden spoon", "train station", "city center", "country road"
  ];

  const slots = document.getElementById("slots");
  const missesList = document.getElementById("missesList");
  const triesText = document.getElementById("triesText");
  const message = document.getElementById("message");
  const wordZone = document.getElementById("wordZone");
  const letterInput = document.getElementById("letterInput");
  const solveBtn = document.getElementById("solveBtn");
  const newWordBtn = document.getElementById("newWordBtn");
  const solveForm = document.getElementById("solveForm");
  const solveInput = document.getElementById("solveInput");
  const cancelSolve = document.getElementById("cancelSolve");
  const submitSolve = document.getElementById("submitSolve");
  const fullscreenBtn = document.getElementById("fullscreenBtn");
  const gameCard = document.getElementById("gameCard");

  let answer = "";
  let guessed = new Set();
  let misses = [];
  let wrongCount = 0;
  let active = false;
  let solveMode = false;
  let confirmNewWord = false;
  let confirmTimer = null;


  function vibrate(pattern){
    if("vibrate" in navigator){
      navigator.vibrate(pattern);
    }
  }

  function flashWrong(){
    gameCard.classList.remove("wrong-flash");
    void gameCard.offsetWidth;
    gameCard.classList.add("wrong-flash");
    setTimeout(() => gameCard.classList.remove("wrong-flash"), 320);
  }

  function pulseCorrect(letter){
    const hits = [...slots.querySelectorAll(`.letter-slot[data-letter="${letter}"]`)];
    hits.forEach(el => {
      el.classList.remove("correct-hit");
      void el.offsetWidth;
      el.classList.add("correct-hit");
    });
    setTimeout(() => hits.forEach(el => el.classList.remove("correct-hit")), 360);
  }

  function pickWord(){
    let next = words[Math.floor(Math.random() * words.length)];
    if(words.length > 1 && next === answer){
      next = words[(words.indexOf(next) + 1) % words.length];
    }
    return next;
  }

  function startRound(){
    answer = pickWord();
    guessed = new Set();
    misses = [];
    wrongCount = 0;
    triesText.classList.remove("warning");
    active = true;
    solveMode = false;
    confirmNewWord = false;
    slots.classList.remove("win","loss");
    gameCard.classList.remove("wrong-flash");
    letterInput.blur();
    solveInput.blur();
    document.body.classList.remove("keyboard-open","solve-mode-layout");
    clearTimeout(confirmTimer);
    newWordBtn.textContent = "New Word";
    newWordBtn.className = "btn btn-primary";
    solveForm.classList.remove("open");
    solveBtn.style.display = "";
    message.className = "message";
    message.textContent = "";
    render();
  }

  function normalizeChar(ch){
    return (ch || "").toUpperCase().replace(/[^A-Z]/g,"").slice(0,1);
  }

  function uniqueLetters(str){
    return [...new Set(str.replace(/[^A-Z]/g,""))];
  }

  function render(){
    slots.innerHTML = "";
    for(const ch of answer){
      if(ch === " "){
        const el = document.createElement("span");
        el.className = "space-slot";
        slots.appendChild(el);
      } else if(/[A-Z]/.test(ch)){
        const el = document.createElement("span");
        el.className = "letter-slot";
        el.dataset.letter = ch;
        el.textContent = guessed.has(ch) ? ch : "";
        slots.appendChild(el);
      } else {
        const el = document.createElement("span");
        el.className = "punct";
        el.textContent = ch;
        slots.appendChild(el);
      }
    }

    missesList.textContent = misses.length ? misses.join(" · ") : "";
    triesText.textContent = `${wrongCount} / 6 misses`;
    triesText.classList.toggle("warning", wrongCount >= 4);

    for(let i=1;i<=6;i++){
      document.getElementById("s"+i).classList.toggle("show", i <= wrongCount);
    }
  }

  function isSolved(){
    return uniqueLetters(answer).every(l => guessed.has(l));
  }

  function finishWin(){
    uniqueLetters(answer).forEach(l => guessed.add(l));
    active = false;
    solveMode = false;
    document.body.classList.remove("solve-mode-layout");
    solveForm.classList.remove("open");
    solveBtn.style.display = "none";
    message.className = "message success";
    message.textContent = "Correct.";
    slots.classList.add("win");
    vibrate([45, 35, 70]);
    render();
  }

  function finishLoss(){
    uniqueLetters(answer).forEach(l => guessed.add(l));
    active = false;
    solveMode = false;
    document.body.classList.remove("solve-mode-layout");
    solveForm.classList.remove("open");
    solveBtn.style.display = "none";
    message.className = "message danger";
    message.textContent = `The answer was ${answer}.`;
    slots.classList.add("loss");
    vibrate([120, 60, 120]);
    flashWrong();
    render();
  }

  function wrongGuess(feedback){
    wrongCount++;
    vibrate(90);
    flashWrong();
    render();
    if(wrongCount >= 6){
      finishLoss();
    } else {
      message.className = "message";
      message.textContent = feedback;
    }
  }

  function handleLetter(raw){
    if(!active || solveMode) return;
    const letter = normalizeChar(raw);
    if(!letter) return;

    if(guessed.has(letter) || misses.includes(letter)){
      message.className = "message";
      message.textContent = `${letter} was already tried.`;
      return;
    }

    if(answer.includes(letter)){
      guessed.add(letter);
      message.className = "message";
      message.textContent = `${letter} is in the word.`;
      render();
      pulseCorrect(letter);
      if(isSolved()) finishWin();
    } else {
      misses.push(letter);
      wrongGuess(`${letter} is not in the word.`);
    }
  }

  function focusLetterInput(){
    if(active && !solveMode){
      letterInput.value = "";
      letterInput.focus({preventScroll:true});
    }
  }

  letterInput.addEventListener("input", e => {
    handleLetter(e.target.value);
    e.target.value = "";
  });

  document.addEventListener("keydown", e => {
    if(!active || solveMode) return;
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    if(/^[a-zA-Z]$/.test(e.key)){
      e.preventDefault();
      handleLetter(e.key);
    }
  });

  wordZone.addEventListener("click", focusLetterInput);

  solveBtn.addEventListener("click", () => {
    if(!active) return;
    solveMode = true;
    document.body.classList.add("solve-mode-layout");
    solveForm.classList.add("open");
    solveBtn.style.display = "none";
    message.className = "message";
    message.textContent = "Enter the full word or phrase.";
    solveInput.value = "";
    setTimeout(() => {
      solveInput.focus({preventScroll:true});
      setTimeout(updateVisibleViewport, 120);
    }, 60);
  });

  function closeSolve(){
    solveMode = false;
    document.body.classList.remove("solve-mode-layout");
    solveForm.classList.remove("open");
    solveBtn.style.display = "";
    message.className = "message";
    message.textContent = "";
    setTimeout(focusLetterInput, 50);
  }

  cancelSolve.addEventListener("click", closeSolve);

  function submitSolution(){
    if(!active || !solveMode) return;
    const attempt = solveInput.value.trim().replace(/\s+/g," ").toUpperCase();
    if(!attempt) return;

    if(attempt === answer){
      finishWin();
    } else {
      solveInput.value = "";
      closeSolve();
      wrongGuess("Wrong solution. One miss added.");
    }
  }

  submitSolve.addEventListener("click", submitSolution);
  solveInput.addEventListener("keydown", e => {
    if(e.key === "Enter"){
      e.preventDefault();
      submitSolution();
    }
  });

  newWordBtn.addEventListener("click", () => {
    if(!active){
      startRound();
      return;
    }

    if(!confirmNewWord){
      confirmNewWord = true;
      newWordBtn.textContent = "New Word?";
      newWordBtn.className = "btn btn-danger";
      message.className = "message";
      message.textContent = "Tap again to abandon this round.";
      clearTimeout(confirmTimer);
      confirmTimer = setTimeout(() => {
        confirmNewWord = false;
        newWordBtn.textContent = "New Word";
        newWordBtn.className = "btn btn-primary";
      }, 2200);
      return;
    }

    startRound();
  });


  async function toggleFullscreen(){
    try{
      if(!document.fullscreenElement){
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch(e){
      // Fullscreen availability varies by browser/device.
    }
  }



  function updateVisibleViewport(){
    const vv = window.visualViewport;
    if(!vv) return;

    const fullHeight = Math.max(window.innerHeight, document.documentElement.clientHeight);
    const ratio = Math.min(1, vv.height / fullHeight);

    /* Keep sizing relative: express the visible height as svh, not pixels. */
    const visibleSvh = Math.max(42, ratio * 100);
    document.documentElement.style.setProperty("--app-height", `${visibleSvh}svh`);

    const keyboardLikelyOpen = ratio < 0.82;
    document.body.classList.toggle("keyboard-open", keyboardLikelyOpen);
  }

  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", updateVisibleViewport);
    window.visualViewport.addEventListener("scroll", updateVisibleViewport);
  }

  window.addEventListener("resize", updateVisibleViewport);

  letterInput.addEventListener("focus", () => setTimeout(updateVisibleViewport, 60));
  letterInput.addEventListener("blur", () => setTimeout(updateVisibleViewport, 90));

  fullscreenBtn.addEventListener("click", toggleFullscreen);

  document.addEventListener("fullscreenchange", () => {
    const activeFullscreen = Boolean(document.fullscreenElement);
    fullscreenBtn.textContent = activeFullscreen ? "×" : "⛶";
    fullscreenBtn.setAttribute("aria-label", activeFullscreen ? "Exit fullscreen" : "Enter fullscreen");
    fullscreenBtn.title = activeFullscreen ? "Exit fullscreen" : "Fullscreen";
  });

  updateVisibleViewport();
  startRound();
})();
</script>
</body>
</html>
